# Refresh the FairPrice board and the 30-day LP audit; the commit triggers a Vercel redeploy.
name: snapshot
on:
  schedule: [{ cron: "30 1 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    # the audit walks position history for 6 pools on the public RPC: ~1-2h warm, longer cold
    timeout-minutes: 240
    defaults: { run: { working-directory: keeper } }
    env:
      SEC_UA: ${{ secrets.SEC_UA }}
      PYTH_PRO_TOKEN: ${{ secrets.PYTH_PRO_TOKEN }}
      RPC_URL: https://api.devnet.solana.com
      RAMBU_PROGRAM_ID: 5REh2DxuEB5j8baJ4Sz2ZFP1WXwnPict8UuYwqPtVUdm
      TRACK: SPY,QQQ,NVDA,AAPL,TSLA
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: keeper/.nvmrc, cache: npm, cache-dependency-path: keeper/package-lock.json }
      # candle cache (gitignored): the audit only fetches what is missing
      - uses: actions/cache@v4
        with: { path: "web/data/ohlcv-*.json", key: "ohlcv-${{ github.run_id }}", restore-keys: ohlcv- }
      - run: npm ci
      - run: npm test
      - run: npm run board
      - run: npm run audit
      - name: commit data
        working-directory: .
        run: |
          git config user.name "rambu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/data # fair, lenders, sewa, positions; ohlcv-* stays ignored
          git diff --cached --quiet || (git commit -m "data: daily snapshot" && git pull --rebase --autostash origin main && git push)
      # no key here: --check reads the keeper pubkey from the registry and checks its balance + state ages
      - run: node keeper.ts --check
